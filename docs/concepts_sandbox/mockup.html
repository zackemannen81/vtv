<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09111f">
  <title>VTV — Very Thin VPN</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #09111f; color: #f3f6fc; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 35%, #14233a 0, #09111f 58%); }
    .app { width: min(100%, 420px); }
    header { display: flex; align-items: center; gap: 11px; margin: 0 0 28px 4px; }
    .brand-icon { width: 38px; height: 38px; }
    .brand-name { font-size: 17px; font-weight: 800; letter-spacing: .14em; }
    .brand-sub { margin-top: 2px; color: #8b9bb2; font-size: 9px; letter-spacing: .18em; }
    main { padding: 30px; border: 1px solid #26364b; border-radius: 24px; background: linear-gradient(155deg, rgba(24,39,59,.97), rgba(14,25,41,.98)); box-shadow: 0 24px 80px #0007; }
    .state { display: flex; align-items: center; justify-content: center; gap: 8px; color: #aab8ca; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #68778d; }
    .connected .dot { background: #40dfb2; box-shadow: 0 0 12px #40dfb2aa; }
    .art { width: 164px; height: 164px; display: block; margin: 26px auto 19px; filter: drop-shadow(0 10px 30px #36d9ce1c); }
    h1 { margin: 0; text-align: center; font-size: 25px; letter-spacing: -.035em; }
    .caption { margin: 8px 0 24px; text-align: center; color: #95a5bb; font-size: 13px; }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .detail { min-width: 0; padding: 13px 14px; border: 1px solid #2a3a50; border-radius: 13px; background: #101c2c; }
    .label { display: block; margin-bottom: 6px; color: #8293aa; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .value { font-size: 13px; font-weight: 600; }
    select { width: 100%; border: 0; outline: 0; background: transparent; color: #f3f6fc; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    select option { background: #101c2c; }
    .connect { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: linear-gradient(100deg, #35d8c2, #5fe1ab); color: #09201f; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform .15s, filter .15s; }
    .connect:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .connect:focus-visible, select:focus-visible { outline: 3px solid #94fff0; outline-offset: 3px; }
    .connect:disabled { cursor: wait; opacity: .7; }
    .connected .connect { background: #26384c; color: #e4edf8; }
    .notice { display: flex; gap: 9px; align-items: flex-start; margin: 18px 2px 0; color: #94a5ba; font-size: 11px; line-height: 1.5; }
    .notice svg { flex: 0 0 15px; margin-top: 1px; color: #69d8cc; }
    footer { padding: 16px 4px 0; text-align: center; color: #63748b; font-size: 10px; }
    @media (max-width: 420px) { body { padding: 16px; } main { padding: 25px 20px; } .art { width: 145px; height: 145px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header aria-label="VTV Very Thin VPN">
      <svg class="brand-icon" viewBox="0 0 100 100" role="img" aria-label="VTV enhörningssymbol">
        <path d="M17 64c-4-16 3-34 20-39 12-4 24 2 29 12l19 3-11 11c2 15-8 29-24 32-14 3-27-5-33-19Z" fill="#dce9f3" stroke="#122139" stroke-width="5" stroke-linejoin="round"/>
        <path d="m57 32 9-24 7 25" fill="#f4bd62" stroke="#122139" stroke-width="4" stroke-linejoin="round"/>
        <path d="M26 36C12 31 9 20 14 13c9 7 15 13 17 21M31 31C20 16 27 8 35 7c6 10 7 18 4 25M39 29C34 14 42 8 50 10c3 10 1 18-4 23" fill="none" stroke="#48d9c5" stroke-width="8" stroke-linecap="round"/>
        <path d="M14 13c9 7 15 13 17 21M35 7c6 10 7 18 4 25" fill="none" stroke="#d66bd2" stroke-width="3" stroke-linecap="round"/>
        <circle cx="61" cy="48" r="2.5" fill="#142039"/><path d="m78 58 8-1-6 6" fill="#f2ae9c"/>
      </svg>
      <div><div class="brand-name">VTV</div><div class="brand-sub">VERY THIN VPN</div></div>
    </header>
    <main aria-labelledby="headline">
      <div class="state" id="state" aria-live="polite"><span class="dot"></span><span id="stateText">Frånkopplad</span></div>
      <svg class="art" viewBox="0 0 200 200" role="img" aria-label="Enhörning och skyddssköld">
        <defs><linearGradient id="mane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42dfca"/><stop offset=".52" stop-color="#8675e9"/><stop offset="1" stop-color="#ed75bc"/></linearGradient><linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173c50"/><stop offset="1" stop-color="#14243d"/></linearGradient></defs>
        <path d="M100 15 166 40v48c0 44-27 76-66 96-39-20-66-52-66-96V40l66-25Z" fill="url(#shield)" stroke="#294760" stroke-width="3"/>
        <path d="M57 115c-11-12-12-31-3-45 8-12 22-18 37-15l25 8 25 3-15 15c3 21-10 39-30 43-15 3-29-1-39-9Z" fill="#e5eef5" stroke="#15243a" stroke-width="5" stroke-linejoin="round"/>
        <path d="m101 57 8-29 11 33" fill="#f3bd68" stroke="#15243a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M63 70C47 61 43 47 50 39c11 7 19 17 20 29M72 63c-13-17-7-30 3-33 9 11 11 22 7 34M83 62c-5-19 4-29 14-27 6 13 3 24-4 33" fill="none" stroke="url(#mane)" stroke-width="12" stroke-linecap="round"/>
        <path d="M99 88c9 2 14 8 14 16" fill="none" stroke="#15243a" stroke-width="4" stroke-linecap="round"/><circle cx="103" cy="79" r="3" fill="#15243a"/><path d="m131 99 12-2-9 8" fill="#eaa99a"/>
        <path d="m89 123 9 9 20-22" fill="none" stroke="#46dfb7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 id="headline">Din anslutning, förenklad.</h1>
      <p class="caption" id="caption">Anslut med ett tryck. Klart.</p>
      <div class="details">
        <div class="detail"><span class="label">Plats</span><select id="location" aria-label="Välj serverplats"><option>🇸🇪 Stockholm</option><option>🇳🇱 Amsterdam</option><option>🇺🇸 New York</option></select></div>
        <div class="detail"><span class="label">Anslutningstid</span><span class="value" id="duration">—</span></div>
      </div>
      <button class="connect" id="connect" type="button">Anslut</button>
      <p class="notice"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8 17 4.5v5.1c0 4.5-2.9 7.6-7 9.5-4.1-1.9-7-5-7-9.5V4.5l7-2.7Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m6.8 9.8 2.1 2.1 4.4-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Visningsdemo — ingen VPN-tunnel skapas och ingen trafik skyddas.</span></p>
    </main>
    <footer>Enkelhet utan att kompromissa med säkerheten.</footer>
  </div>
  <script>
    (() => {
      const app = document.querySelector('#app');
      const button = document.querySelector('#connect');
      const stateText = document.querySelector('#stateText');
      const duration = document.querySelector('#duration');
      const caption = document.querySelector('#caption');
      const location = document.querySelector('#location');
      let connectedAt = 0;
      let timer;

      function renderDuration() {
        if (!connectedAt) return;
        const seconds = Math.floor((Date.now() - connectedAt) / 1000);
        duration.textContent = [Math.floor(seconds / 3600), Math.floor(seconds / 60) % 60, seconds % 60]
          .map(value => String(value).padStart(2, '0')).join(':');
      }

      button.addEventListener('click', () => {
        if (button.disabled) return;
        button.disabled = true;
        const nextConnects = !connectedAt;
        stateText.textContent = nextConnects ? 'Ansluter… (simulerat)' : 'Kopplar från…';
        window.setTimeout(() => {
          if (nextConnects) {
            connectedAt = Date.now();
            app.classList.add('connected');
            stateText.textContent = 'Ansluten (simulerat)';
            caption.textContent = `Skyddad plats: ${location.value.replace(/^\S+\s/, '')}`;
            button.textContent = 'Koppla från';
            renderDuration();
            timer = window.setInterval(renderDuration, 1000);
          } else {
            connectedAt = 0;
            window.clearInterval(timer);
            app.classList.remove('connected');
            stateText.textContent = 'Frånkopplad';
            caption.textContent = 'Anslut med ett tryck. Klart.';
            duration.textContent = '—';
            button.textContent = 'Anslut';
          }
          button.disabled = false;
        }, 550);
      });

      location.addEventListener('change', () => {
        if (connectedAt) caption.textContent = `Skyddad plats: ${location.value.replace(/^\S+\s/, '')} (simulerat)`;
      });
    })();
  </script>
</body>
</html>
