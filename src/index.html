<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09111f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self';">
  <title>VTV — Very Thin VPN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header aria-label="VTV Very Thin VPN">
      <img class="brand-icon" src="assets/vtv_icon.png" alt="">
      <div>
        <div class="brand-name">VTV</div>
        <div class="brand-sub">VERY THIN VPN</div>
      </div>
    </header>
    <main aria-labelledby="headline">
      <div class="state" aria-live="polite"><span class="dot"></span><span>Frånkopplad</span></div>
      <img class="art" src="assets/vtv_splash.png" alt="VTV:s enhörningssymbol i en sköld">
      <h1 id="headline">Din anslutning, förenklad.</h1>
      <p class="caption">WireGuard-integrering är inte konfigurerad.</p>
      <button class="connect" type="button" disabled aria-describedby="notice">Anslut</button>
      <p class="notice" id="notice"><span class="notice-icon" aria-hidden="true">ⓘ</span><span>Prototyp — ingen VPN-tunnel skapas och nätverkstrafik skyddas inte.</span></p>
    </main>
    <footer>En liten klient. Tydlig status.</footer>
  </div>
</body>
</html>
