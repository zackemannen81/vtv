<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
  <title>vtv — Very thin VPN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <div class="brand">vtv<span class="brand-dot">.</span></div>
    <p class="eyebrow">WINDOWS PROTOTYPE</p>
    <h1>Din anslutning</h1>
    <section class="card" aria-live="polite">
      <div class="status-row"><span id="status-dot" class="dot"></span><span id="status">Frånkopplad</span></div>
      <p class="hint">WireGuard-integrering är inte konfigurerad.</p>
      <button id="connect" disabled>Anslut</button>
      <p class="notice">Den här prototypen skapar ingen VPN-tunnel och skyddar inte nätverkstrafik.</p>
    </section>
    <footer>En liten klient. Tydlig status.</footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
